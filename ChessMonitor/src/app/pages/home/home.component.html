<app-master-page>
  <!-- Banner Template -->
  <ng-template #banner>
    <div class="hero-section">
      <h1 class="main-title">{{ title }}</h1>
      <p class="subtitle">Monitor and analyze chess games in real-time</p>
    </div>
  </ng-template>

  <!-- Left Navigation Template -->
  <ng-template #leftNavigation>
    <div class="nav-menu">
      <ul>
        <li><a href="#" class="nav-link">Dashboard</a></li>
        <li><a href="#" class="nav-link">Game Analysis</a></li>
        <li><a href="#" class="nav-link">Statistics</a></li>
        <li><a href="#" class="nav-link">Training</a></li>
        <li><a href="#" class="nav-link">Settings</a></li>
      </ul>
    </div>
  </ng-template>

  <!-- Main Content Template -->
  <ng-template #content>
    <!-- Create a text to search player -->
    <div class="search-player">
      <input type="text" placeholder="Search for a player..." [(ngModel)]="playerUsername" />
      <button class="search-button" (click)="gotoPlayerPage()">Search</button>
    </div>
  </ng-template>

  <!-- Footer Template -->
  <ng-template #foot>
    <div class="footer-content">
      <p>&copy; 2025 Chess Monitor. All rights reserved.</p>
      <div class="footer-links">
        <a href="#" class="footer-link">Privacy Policy</a>
        <a href="#" class="footer-link">Terms of Service</a>
        <a href="#" class="footer-link">Contact</a>
      </div>
    </div>
  </ng-template>
</app-master-page>
